# Keep history local unless sync is requested explicitly.
auto_sync = false

# Up-arrow stays within the current shell session.
filter_mode_shell_up_key_binding = "session"

# Use the daemon's in-memory index for interactive fuzzy search.
search_mode = "daemon-fuzzy"

style = "auto"
enter_accept = true

[sync]
records = true

[daemon]
enabled = true
autostart = true
